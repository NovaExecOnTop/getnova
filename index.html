<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Executor</title>
  <style>
    /* reset & box sizing */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 1rem;
    }

    /* Top bar text smaller */
    h1 {
      font-size: 3rem;            /* dikurangi sedikit */
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateY(50px);
      animation: slideUp 0.8s ease-out forwards;
      animation-delay: 0.2s;
    }

    p.subtitle {
      font-size: 1rem;
      opacity: 0;
      transform: translateY(50px);
      animation: slideUp 0.8s ease-out forwards;
      animation-delay: 0.3s;
      margin-bottom: 2rem;
    }

    /* Tombol minimal dengan animasi */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    .btn {
      padding: 1rem;
      background: transparent;
      border: 2px solid #fff;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translateY(50px);
      animation: slideUp 0.8s ease-out forwards;
    }
    .btn:nth-child(1) { animation-delay: 0.4s; }
    .btn:nth-child(2) { animation-delay: 0.5s; }
    .btn:nth-child(3) { animation-delay: 0.6s; }

    /* Keyframes slideUp */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.75rem;
      opacity: 0.5;
      transform: translateY(50px);
      animation: slideUp 0.8s ease-out forwards;
      animation-delay: 0.7s;
    }
  </style>
</head>
<body>

  <!-- Judul utama -->
  <h1>NOVA EXECUTOR</h1>
  <p class="subtitle">Download, Discord &amp; WhatsApp Community</p>

  <!-- Tombol dengan animasi slideUp -->
  <div class="buttons">
    <a id="download-btn" class="btn" href="#">Download</a>
    <a id="discord-btn"  class="btn" href="#">Discord Server</a>
    <a id="whatsapp-btn" class="btn" href="#">WhatsApp Community</a>
  </div>

  <!-- Footer kecil -->
  <footer>© 2025 Nova Executor, Made with love using Xeno API</footer>

  <script>
    document.getElementById('download-btn').href = 'https://www.mediafire.com/file/kfhsit2cxtrznwg/Nova+v2.rar/file';
    document.getElementById('discord-btn').href    = 'https://discord.gg/xxxxxx';
    document.getElementById('whatsapp-btn').href = 'https://whatsapp.com/channel/0029Vb60YvVJJhzRN94YGB2C';
  </script>
</body>
</html>
